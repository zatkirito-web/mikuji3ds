name: build-ipa

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iPadOS arm64 (unsigned)
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick the newest Xcode on the runner
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Secret scan
        run: bash tools/secret_scan.sh

      - name: Install headers the project expects to find on the machine
        run: |
          # The project reads Boost from a Homebrew prefix, and Vulkan, VMA and glslang from a
          # Vulkan SDK in the author's home directory. Neither exists on a runner, so supply the
          # headers here. Everything else (fmt, SDL3, teakra, dynarmic, sirit, glslang's compiled
          # libraries) arrives as a prebuilt xcframework through SharedDependencies and is
          # deliberately NOT installed: a Homebrew copy on the header search path would shadow
          # those and link against a different ABI.
          brew install boost vulkan-headers glslang
          brew list --versions boost vulkan-headers glslang

          # VMA is a single header and has no Homebrew formula.
          VMA_VERSION=v3.4.0
          curl -fsSL -o /opt/homebrew/include/vk_mem_alloc.h             "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/${VMA_VERSION}/include/vk_mem_alloc.h"

          ls -d /opt/homebrew/include/boost /opt/homebrew/include/vulkan                 /opt/homebrew/include/glslang
          ls -l /opt/homebrew/include/vk_mem_alloc.h

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Folium.xcodeproj \
            -scheme Folium

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app was produced"
            exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # SideStore and AltStore re-sign the payload themselves, so an unsigned IPA is enough.
          zip -qry Mikuji3DS-unsigned.ipa Payload
          ls -lh Mikuji3DS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mikuji3DS-unsigned-ipa
          path: Mikuji3DS-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
